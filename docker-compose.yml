services:
  # El motor de tu panadería (Python)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  # La vitrina de tu panadería (React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend # Crearemos este en el siguiente paso
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend