[pytest]
# Configuración de pytest para ROZVI Backend

# Directorio de pruebas
testpaths = .

# Patrón de archivos de prueba
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones por defecto
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Markers personalizados
markers =
    unit: Pruebas unitarias
    integration: Pruebas de integración
    slow: Pruebas lentas
    security: Pruebas de seguridad
    webhook: Pruebas de webhooks

# Timeouts (opcional, requiere pytest-timeout)
timeout = 30
